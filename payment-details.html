<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Details - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f6f9;
color:#222;
}

header{
background:#0b5ed7;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:25px;
}

.back-btn{
background:white;
color:#0b5ed7;
text-decoration:none;
padding:10px 17px;
border-radius:6px;
font-weight:bold;
}

.container{
max-width:1150px;
margin:35px auto;
padding:0 20px;
}

.payment-card{
background:white;
padding:24px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.top{
display:flex;
justify-content:space-between;
gap:20px;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:18px;
}

.top h2{
margin:0;
color:#0b5ed7;
}

.date{
color:#666;
font-size:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.detail{
background:#f7f9fc;
padding:14px;
border-radius:8px;
}

.detail b{
display:block;
font-size:13px;
color:#666;
margin-bottom:6px;
}

.products{
margin-top:18px;
padding-top:18px;
border-top:1px solid #ddd;
}

.product{
background:#f7f9fc;
padding:11px;
border-radius:7px;
margin-top:8px;
display:flex;
justify-content:space-between;
}

.bottom{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-top:20px;
flex-wrap:wrap;
}

.amount{
font-size:25px;
font-weight:bold;
color:#198754;
}

.status{
padding:10px 15px;
border-radius:7px;
font-weight:bold;
}

.pending{
background:#fff3cd;
color:#856404;
}

.paid{
background:#d1e7dd;
color:#0f5132;
}

.mark-paid{
background:#198754;
color:white;
border:none;
padding:11px 17px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

.mark-paid:hover{
background:#157347;
}

.message{
background:white;
padding:35px;
text-align:center;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.10);
font-size:18px;
color:#666;
}

@media(max-width:850px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

header{
padding:15px;
}

header h1{
font-size:19px;
}

.top{
flex-direction:column;
}

.grid{
grid-template-columns:1fr;
}

.product{
flex-direction:column;
gap:5px;
}

.bottom{
align-items:stretch;
}

.mark-paid{
width:100%;
}

}

</style>

</head>

<body>

<header>

<h1>Payment Details</h1>

<a href="dashboard.html" class="back-btn">

← Dashboard

</a>

</header>

<div class="container">

<div id="paymentContainer">

<div class="message">

Loading payment details...

</div>

</div>

</div>

<script type="module">

import {

auth,

db

} from "./firebase-config.js";

import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {

collection,

getDocs,

query,

orderBy,

doc,

updateDoc

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const paymentContainer = document.getElementById("paymentContainer");


onAuthStateChanged(auth, function(user){

if(!user){

alert("Admin Login Required");

window.location.href="login.html";

return;

}

loadPayments();

});


async function loadPayments(){

try{

const paymentQuery = query(

collection(db,"orders"),

orderBy("createdAt","desc")

);

const snapshot = await getDocs(paymentQuery);


if(snapshot.empty){

paymentContainer.innerHTML=

`

<div class="message">

Abhi koi payment/order available nahi hai.

</div>

`;

return;

}


paymentContainer.innerHTML="";


snapshot.forEach(function(orderDoc){

const order = orderDoc.data();

const orderId = orderDoc.id;

const paymentStatus = order.paymentStatus || "Pending";

const statusClass =

paymentStatus.toLowerCase() === "paid"

?

"paid"

:

"pending";


let dateText = "Date not available";

if(order.createdAt){

dateText =

order.createdAt

.toDate()

.toLocaleString("en-IN");

}


let productsHtml="";

if(Array.isArray(order.cart) && order.cart.length>0){

order.cart.forEach(function(item){

productsHtml +=

`

<div class="product">

<span>${item.name || "Product"}</span>

<b>₹${Number(item.price || 0)}</b>

</div>

`;

});

}

else{

productsHtml="<p>Product details not available.</p>";

}


const paidButton =

paymentStatus.toLowerCase() === "paid"

?

""

:

`

<button

class="mark-paid"

onclick="markAsPaid('${orderId}')"

>

✓ Mark as Paid

</button>

`;


const card = document.createElement("div");

card.className="payment-card";

card.innerHTML=

`

<div class="top">

<div>

<h2>${order.customerName || "Customer"}</h2>

<p>Order ID: ${orderId}</p>

</div>

<div class="date">

${dateText}

</div>

</div>


<div class="grid">

<div class="detail">

<b>Mobile Number</b>

${order.mobile || "Not added"}

</div>

<div class="detail">

<b>Email</b>

${order.email || "Not added"}

</div>

<div class="detail">

<b>Programme</b>

${order.programme || "Not added"}

</div>

</div>


<div class="products">

<h3>Purchased Products</h3>

${productsHtml}

</div>


<div class="bottom">

<div class="amount">

Total: ₹${Number(order.totalAmount || 0)}

</div>


<div class="status ${statusClass}">

Payment: ${paymentStatus}

</div>


${paidButton}

</div>

`;

paymentContainer.appendChild(card);

});

}

catch(error){

console.error(error);

paymentContainer.innerHTML=

`

<div class="message">

Payment details load nahi hui.

<br><br>

${error.message}

</div>

`;

}

}


window.markAsPaid = async function(orderId){

const confirmPayment = confirm(

"Payment verify karne ke baad hi Paid karein. Continue?"

);

if(!confirmPayment){

return;

}

try{

await updateDoc(

doc(db,"orders",orderId),

{

paymentStatus:"Paid"

}

);

alert("Payment status updated to Paid ✅");

loadPayments();

}

catch(error){

alert("Status update failed: "+error.message);

console.error(error);

}

};

</script>

</body>

</html>
