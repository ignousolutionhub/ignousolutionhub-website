<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - IGNOU Solution Hub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

.container{
width:90%;
max-width:700px;
margin:40px auto;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#003366;
}

input,textarea,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#198754;
color:#fff;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#157347;
}
</style>

</head>

<body>

<div class="container">

<h2>Checkout</h2>

<form id="checkoutForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="mobile" placeholder="Mobile Number" required>

<input type="email" id="email" placeholder="Email">

<input type="text" id="enrollment" placeholder="IGNOU Enrollment Number" required>

<select id="programme">
<option>DECE</option>
</select>

<select id="course">
<option>DECE-01</option>
<option>DECE-02</option>
<option>DECE-03</option>
</select>

<textarea id="address" placeholder="Complete Postal Address" rows="4" required></textarea>

<input type="text" id="pincode" placeholder="PIN Code" required>

<button type="submit">
Place Order
</button>

</form>

</div>

<script>

document.getElementById("checkoutForm").addEventListener("submit",function(e){

e.preventDefault();

let order={

name:name.value,
mobile:mobile.value,
email:email.value,
enrollment:enrollment.value,
programme:programme.value,
course:course.value,
address:address.value,
pincode:pincode.value,

cart:JSON.parse(localStorage.getItem("cart"))||[]

};

localStorage.setItem("latestOrder",JSON.stringify(order));

window.location.href="payment.html";

});

</script>

</body>
</html>
