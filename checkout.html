<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - IGNOU Assignment Hub</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f5f5;color:#222}.site-header{position:sticky;top:0;z-index:1000;background:#0b5ed7;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;box-shadow:0 2px 8px #0003}.logo{font-size:22px;font-weight:bold}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:bold}.cart-link{background:#fff;color:#0b5ed7;padding:8px 13px;border-radius:20px;text-decoration:none;font-weight:bold}.container{width:90%;max-width:700px;margin:30px auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2)}h2{text-align:center;color:#003366}.order-box{background:#eef5ff;padding:15px;border-radius:8px;margin-bottom:18px}.order-item{padding:8px 0;border-bottom:1px solid #d5dff0}.order-item:last-child{border-bottom:0}.total{font-size:22px;font-weight:bold;color:#198754;margin-top:10px}input,textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;font-size:16px}button{width:100%;padding:15px;background:#198754;color:#fff;font-size:18px;border:none;border-radius:6px;cursor:pointer}button:hover{background:#157347}@media(max-width:700px){.site-header{padding:12px;flex-direction:column;align-items:flex-start}.nav{gap:9px}}</style></head><body><header class="site-header"><div class="logo">IGNOU Assignment Hub</div><nav class="nav"><a href="index.html">Home</a><a href="assignments.html">Assignments</a><a href="project-services.html">Project / Internship</a><a href="study-material.html">Study Material</a><a href="guide.html">Guide</a><a href="contact.html">Contact</a><a href="track-order.html">Track Order</a></nav><a class="cart-link" href="cart-fixed.html">🛒 Cart <span id="cartCount">0</span></a></header><div class="container"><h2>Checkout</h2><div class="order-box"><b>Selected Products</b><div id="selectedProducts"></div><div class="total">Total: ₹<span id="orderTotal">0</span></div></div><form id="checkoutForm"><input type="text" id="name" placeholder="Full Name" required><input type="tel" id="mobile" placeholder="Mobile Number" required><input type="email" id="email" placeholder="Email (optional)"><input type="text" id="enrollment" placeholder="IGNOU Enrollment Number" required><textarea id="address" placeholder="Complete Postal Address" rows="4" required></textarea><input type="text" id="pincode" placeholder="PIN Code" required><button type="submit">Place Order →</button></form></div><script>function getCart(){try{return JSON.parse(localStorage.getItem('cart'))||[]}catch(e){return[]}}function normalizeLegacyCart(){let cart=getCart(),changed=false;cart=cart.map(item=>{const name=String(item.name||''),type=String(item.productType||'').toLowerCase(),combined=(name+' '+type).toLowerCase();if(combined.includes('synopsis')||type==='synopsis'){if(Number(item.price)!==1000){item.price=1000;changed=true}}else if(combined.includes('internship')||combined.includes('project')||combined.includes('dissertation')||combined.includes('field work')){if(Number(item.price)!==1500){item.price=1500;changed=true}}return item});if(changed)localStorage.setItem('cart',JSON.stringify(cart));return cart}const cart=normalizeLegacyCart();let total=0;const box=document.getElementById('selectedProducts');if(!cart.length){alert('Cart empty hai.');location.href='cart-fixed.html'}document.getElementById('cartCount').innerText=cart.length;cart.forEach(item=>{const p=Number(item.price)||0;total+=p;const d=document.createElement('div');d.className='order-item';d.innerHTML='<b>'+escapeHtml(item.name||'Product')+'</b> — ₹'+p+(item.programme?'<br><small>Programme: '+escapeHtml(item.programme)+'</small>':'')+(item.course?'<br><small>Course Code: '+escapeHtml(item.course)+'</small>':'');box.appendChild(d)});document.getElementById('orderTotal').innerText=total;function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('checkoutForm').addEventListener('submit',function(e){e.preventDefault();const order={name:document.getElementById('name').value,mobile:document.getElementById('mobile').value,email:document.getElementById('email').value,enrollment:document.getElementById('enrollment').value,address:document.getElementById('address').value,pincode:document.getElementById('pincode').value,cart:cart,totalAmount:total};localStorage.setItem('latestOrder',JSON.stringify(order));location.href='payment.html'});</script></body></html>
