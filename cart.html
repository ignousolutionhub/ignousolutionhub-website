<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f6f8;
color:#222;
}

header{
background:#0b5ed7;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:25px;
}

.back-btn{
background:white;
color:#0b5ed7;
text-decoration:none;
padding:10px 16px;
border-radius:6px;
font-weight:bold;
}

.container{
max-width:950px;
margin:30px auto;
padding:0 18px;
}

.cart-box{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 12px rgba(0,0,0,.10);
}

.cart-title{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:5px;
}

.cart-title h2{
margin:0;
}

.item-count{
background:#e8f0fe;
color:#0b5ed7;
padding:7px 12px;
border-radius:20px;
font-weight:bold;
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
border-bottom:1px solid #ddd;
padding:20px 0;
}

.product-info{
flex:1;
}

.product-info h3{
margin:0 0 8px;
}

.product-info p{
margin:0;
color:#666;
}

.price{
font-size:20px;
font-weight:bold;
color:#0b5ed7;
margin-top:8px !important;
}

.remove{
background:#dc3545;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

.remove:hover{
background:#b02a37;
}

.summary{
margin-top:25px;
padding-top:20px;
border-top:2px solid #ddd;
}

.summary-row{
display:flex;
justify-content:space-between;
margin:10px 0;
font-size:17px;
}

.total{
font-size:24px;
font-weight:bold;
color:#0b5ed7;
}

.checkout{
margin-top:20px;
width:100%;
background:#198754;
color:white;
border:none;
padding:15px;
border-radius:7px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.checkout:hover{
background:#157347;
}

.empty{
text-align:center;
padding:50px 15px;
color:#666;
}

.shop-btn{
display:inline-block;
margin-top:15px;
background:#0b5ed7;
color:white;
text-decoration:none;
padding:12px 20px;
border-radius:6px;
font-weight:bold;
}

@media(max-width:600px){

header{
padding:15px;
}

header h1{
font-size:19px;
}

.product{
align-items:flex-start;
flex-direction:column;
}

.remove{
width:100%;
}

}

</style>
</head>

<body>

<header>

<h1>🛒 IGNOU Solution Hub Cart</h1>

href="assignments.html" class="back-btn">
← Continue Shopping
</a>

</header>


<div class="container">

<div class="cart-box">

<div class="cart-title">

<h2>Your Cart</h2>

<div class="item-count">

<span id="itemCount">0</span> Items

</div>

</div>


<div id="cartItems"></div>


<div class="summary" id="summaryBox">

<div class="summary-row">

<span>Total Items</span>

<strong id="totalItems">0</strong>

</div>


<div class="summary-row total">

<span>Total Amount</span>

<span>₹<span id="totalAmount">0</span></span>

</div>


<button class="checkout" onclick="goCheckout()">

Proceed To Checkout →

</button>

</div>


</div>

</div>


<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];


function showCart(){

let cartItems=document.getElementById("cartItems");

let total=0;

let totalItems=cart.length;


if(cart.length===0){

cartItems.innerHTML=`

<div class="empty">

<h3>Your cart is empty 🛒</h3>

<p>Add assignments, projects or study material to continue.</p>

<a href="product-list.html" class="shop-btn">

Start Shopping

</a>

</div>

`;

document.getElementById("summaryBox").style.display="none";

document.getElementById("itemCount").innerText=0;

return;

}


document.getElementById("summaryBox").style.display="block";


let html="";


cart.forEach((item,index)=>{

let price=Number(item.price) || 0;

total += price;


html += `

<div class="product">

<div class="product-info">

<h3>${item.name}</h3>

<p>IGNOU Study Material</p>

<p class="price">

₹${price}

</p>

</div>


<button class="remove" onclick="removeItem(${index})">

Remove

</button>

</div>

`;

});


cartItems.innerHTML=html;

document.getElementById("itemCount").innerText=totalItems;

document.getElementById("totalItems").innerText=totalItems;

document.getElementById("totalAmount").innerText=total;

}


function removeItem(index){

cart.splice(index,1);

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

showCart();

}


function goCheckout(){

if(cart.length===0){

alert("Cart empty hai.");

return;

}

window.location.href="checkout.html";

}


showCart();

</script>

</body>
</html>
