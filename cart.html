<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart - IGNOU Solution Hub</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#0b5ed7;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

button{
    background:#198754;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.remove{
    background:#dc3545;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:20px;
}

.checkout{
    margin-top:20px;
    width:100%;
    font-size:18px;
}
</style>

</head>

<body>

<header>
<h1>IGNOU Assignment Cart</h1>
</header>


<div class="container">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="totalAmount">0</span>
</div>


<button class="checkout" onclick="goCheckout()">
Proceed To Checkout
</button>


</div>



<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];


function showCart(){

let html="";
let total=0;


if(cart.length==0){

document.getElementById("cartItems").innerHTML=
"<h3>Your cart is empty</h3>";

return;

}


cart.forEach((item,index)=>{

total += item.price;


html += `

<div class="product">

<div>
<h3>${item.name}</h3>
<p>Price: ₹${item.price}</p>
</div>


<button class="remove" onclick="removeItem(${index})">
Remove
</button>


</div>

`;

});


document.getElementById("cartItems").innerHTML=html;

document.getElementById("totalAmount").innerHTML=total;


}



function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

showCart();

}



function goCheckout(){

if(cart.length==0){

alert("Cart empty hai");

return;

}

window.location.href="checkout.html";

}



showCart();


</script>


</body>
</html>
