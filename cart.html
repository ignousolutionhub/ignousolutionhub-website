<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart - IGNOU Assignment Hub</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f6f8;color:#222}.site-header{position:sticky;top:0;z-index:1000;background:#0b5ed7;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;box-shadow:0 2px 8px #0003}.logo{font-size:22px;font-weight:bold}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:bold}.cart-link{background:#fff;color:#0b5ed7;padding:8px 13px;border-radius:20px;text-decoration:none;font-weight:bold}.container{max-width:950px;margin:30px auto;padding:0 18px}.cart-box{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1)}.cart-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:15px}.cart-title h2{margin:0}.item-count{background:#e8f0fe;color:#0b5ed7;padding:7px 12px;border-radius:20px;font-weight:bold}.product{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #ddd;padding:20px 0}.product-info{flex:1}.product-info h3{margin:0 0 8px}.product-info p{margin:5px 0;color:#666}.price{font-size:20px;font-weight:bold;color:#0b5ed7;margin-top:8px!important}.remove{background:#dc3545;color:white;border:none;padding:10px 15px;border-radius:6px;cursor:pointer}.summary{margin-top:25px;padding-top:20px;border-top:2px solid #ddd}.summary-row{display:flex;justify-content:space-between;margin:10px 0;font-size:17px}.total{font-size:24px;font-weight:bold;color:#0b5ed7}.checkout{margin-top:20px;width:100%;background:#198754;color:white;border:none;padding:15px;border-radius:7px;font-size:18px;font-weight:bold;cursor:pointer}.empty{text-align:center;padding:50px 15px;color:#666}.shop-btn{display:inline-block;margin-top:15px;background:#0b5ed7;color:white;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold}@media(max-width:700px){.site-header{padding:12px;flex-direction:column;align-items:flex-start}.nav{gap:9px}.product{align-items:flex-start;flex-direction:column}.remove{width:100%}}</style></head><body><header class="site-header"><div class="logo">IGNOU Assignment Hub</div><nav class="nav"><a href="index.html">Home</a><a href="assignments.html">Assignments</a><a href="project-services.html">Project / Internship</a><a href="study-material.html">Study Material</a><a href="guide.html">Guide</a><a href="contact.html">Contact</a></nav><a class="cart-link" href="cart.html">🛒 Cart <span id="cartCount">0</span></a></header><div class="container"><div class="cart-box"><div class="cart-title"><h2>Your Cart</h2><div class="item-count"><span id="itemCount">0</span> Items</div></div><div id="cartItems"></div><div class="summary" id="summaryBox"><div class="summary-row"><span>Total Items</span><strong id="totalItems">0</strong></div><div class="summary-row total"><span>Total Amount</span><span>₹<span id="totalAmount">0</span></span></div><button class="checkout" onclick="goCheckout()">Proceed To Checkout →</button></div></div></div><script>function getCart(){try{return JSON.parse(localStorage.getItem('cart'))||[]}catch(e){return[]}}function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}let cart=getCart();function showCart(){cart=getCart();const box=document.getElementById('cartItems');document.getElementById('cartCount').innerText=cart.length;if(!cart.length){box.innerHTML='<div class="empty"><h3>Your cart is empty 🛒</h3><p>Add assignments, projects or study material to continue.</p><a href="project-services.html" class="shop-btn">Start Shopping</a></div>';document.getElementById('summaryBox').style.display='none';document.getElementById('itemCount').innerText='0';return}let total=0,html='';cart.forEach((item,index)=>{const price=Number(item.price)||0;total+=price;html+='<div class="product"><div class="product-info"><h3>'+esc(item.name||'Product')+'</h3>'+(item.programme?'<p><b>Programme:</b> '+esc(item.programme)+'</p>':'')+(item.course?'<p><b>Course Code:</b> '+esc(item.course)+'</p>':'')+(item.productType?'<p><b>Type:</b> '+esc(item.productType)+'</p>':'')+'<p class="price">₹'+price+'</p></div><button class="remove" onclick="removeItem('+index+')">Remove</button></div>'});box.innerHTML=html;document.getElementById('summaryBox').style.display='block';document.getElementById('itemCount').innerText=cart.length;document.getElementById('totalItems').innerText=cart.length;document.getElementById('totalAmount').innerText=total}function removeItem(index){cart.splice(index,1);localStorage.setItem('cart',JSON.stringify(cart));showCart()}function goCheckout(){if(!getCart().length){alert('Cart empty hai.');return}window.location.href='checkout.html'}showCart();</script></body></html>
