<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Customer Orders - IGNOU Solution Hub</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f4f6f9;color:#222}header{background:#0b5ed7;color:#fff;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:25px}.back-btn{background:#fff;color:#0b5ed7;text-decoration:none;padding:10px 17px;border-radius:6px;font-weight:bold}.container{max-width:1150px;margin:35px auto;padding:0 20px}.order-card{background:#fff;padding:24px;margin-bottom:20px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.12)}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #ddd;padding-bottom:15px;margin-bottom:18px}.top h2{margin:0;color:#0b5ed7}.date{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.detail{background:#f7f9fc;padding:14px;border-radius:8px}.detail b{display:block;font-size:13px;color:#666;margin-bottom:6px}.products{margin-top:18px;padding-top:18px;border-top:1px solid #ddd}.product{background:#f7f9fc;padding:11px;border-radius:7px;margin-top:8px;display:flex;justify-content:space-between}.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:20px;flex-wrap:wrap}.amount{font-size:25px;font-weight:bold;color:#198754}.status{padding:10px 15px;border-radius:7px;font-weight:bold;background:#fff3cd;color:#856404}.paid{background:#d1e7dd;color:#0f5132}.mark-paid,.save-track{background:#198754;color:#fff;border:none;padding:11px 17px;border-radius:6px;font-weight:bold;cursor:pointer}.tracking-box{margin-top:20px;padding:18px;background:#eef5ff;border-radius:9px;border:1px solid #cfe0ff}.tracking-box h3{margin-top:0;color:#0b5ed7}.tracking-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tracking-grid input,.tracking-grid select{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}.tracking-grid .full{grid-column:1/-1}.tracking-grid textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px;resize:vertical}.save-track{margin-top:10px}.message{background:#fff;padding:35px;text-align:center;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);font-size:18px;color:#666}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.tracking-grid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:15px}header h1{font-size:19px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.product{flex-direction:column;gap:5px}.bottom{align-items:stretch}.mark-paid,.save-track{width:100%}}</style></head><body><header><h1>Customer Orders & Tracking</h1><a href="dashboard.html" class="back-btn">← Dashboard</a></header><div class="container"><div id="ordersContainer"><div class="message">Loading orders...</div></div></div>
<script type="module">
import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';import{collection,getDocs,query,orderBy,doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const container=document.getElementById('ordersContainer');onAuthStateChanged(auth,user=>{if(!user){alert('Admin Login Required');location.href='login.html';return}loadOrders()});
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function loadOrders(){try{const q=query(collection(db,'orders'),orderBy('createdAt','desc'));const snap=await getDocs(q);if(snap.empty){container.innerHTML='<div class="message">Abhi koi customer order available nahi hai.</div>';return}container.innerHTML='';snap.forEach(d=>renderOrder(d.id,d.data()))}catch(e){console.error(e);container.innerHTML='<div class="message">Orders load nahi hue.<br><br>'+esc(e.message)+'</div>'}}
function renderOrder(id,o){const paymentStatus=o.paymentStatus||'Pending';const statusClass=paymentStatus.toLowerCase()==='paid'?'paid':'';let date='Date not available';if(o.createdAt?.toDate)date=o.createdAt.toDate().toLocaleString('en-IN');let products='';(o.cart||[]).forEach(item=>{products+=`<div class="product"><span>${esc(item.name||'Product')}${item.course?`<br><small>Course Code: ${esc(item.course)}</small>`:''}</span><b>₹${Number(item.price||0)}</b></div>`});const card=document.createElement('div');card.className='order-card';card.innerHTML=`<div class="top"><div><h2>${esc(o.customerName||'Customer')}</h2><p>Order ID: ${esc(id)}</p></div><div class="date">${esc(date)}</div></div><div class="grid"><div class="detail"><b>Mobile Number</b>${esc(o.mobile||'Not added')}</div><div class="detail"><b>Email</b>${esc(o.email||'Not added')}</div><div class="detail"><b>Enrollment Number</b>${esc(o.enrollment||'Not added')}</div><div class="detail"><b>Address</b>${esc(o.address||'Not added')}</div><div class="detail"><b>PIN Code</b>${esc(o.pincode||'Not added')}</div><div class="detail"><b>Payment Status</b><span class="status ${statusClass}">${esc(paymentStatus)}</span></div></div><div class="products"><h3>Purchased Products</h3>${products||'<p>Product details not available.</p>'}</div><div class="tracking-box"><h3>📦 Add Delivery / Tracking Details</h3><div class="tracking-grid"><div><label><b>Tracking Status</b></label><select id="ts_${id}"><option>Processing</option><option>Packed</option><option>Dispatched</option><option>In Transit</option><option>Delivered</option><option>Cancelled</option></select></div><div><label><b>Speed Post / Tracking Number</b></label><input id="tn_${id}" placeholder="e.g. EM123456789IN" value="${esc(o.trackingNumber||'')}"></div><div class="full"><label><b>Customer Update / Note</b></label><textarea id="tnote_${id}" rows="2" placeholder="e.g. Parcel dispatched via India Post">${esc(o.trackingNote||'')}</textarea></div></div><button class="save-track" onclick="saveTracking('${id}')">💾 Save Tracking Details</button><span id="saved_${id}" style="margin-left:10px;color:#198754;font-weight:bold"></span></div><div class="bottom"><div class="amount">Total: ₹${Number(o.totalAmount||0)}</div><div class="status ${statusClass}">Payment: ${esc(paymentStatus)}</div>${paymentStatus.toLowerCase()!=='paid'?`<button class="mark-paid" onclick="markAsPaid('${id}')">✓ Mark as Paid</button>`:''}</div>`;container.appendChild(card);const selected=o.trackingStatus||o.dispatchStatus||'Processing';document.getElementById('ts_'+id).value=['Processing','Packed','Dispatched','In Transit','Delivered','Cancelled'].includes(selected)?selected:'Processing'}
window.saveTracking=async function(id){const status=document.getElementById('ts_'+id).value;const number=document.getElementById('tn_'+id).value.trim();const note=document.getElementById('tnote_'+id).value.trim();try{await updateDoc(doc(db,'orders',id),{trackingStatus:status,trackingNumber:number,trackingNote:note,dispatchStatus:status,trackingUpdatedAt:serverTimestamp()});document.getElementById('saved_'+id).innerText='Saved ✓';setTimeout(()=>{const e=document.getElementById('saved_'+id);if(e)e.innerText=''},2500)}catch(e){alert('Tracking update failed: '+e.message);console.error(e)}};
window.markAsPaid=async function(id){if(!confirm('Payment verify karne ke baad hi Paid karein. Continue?'))return;try{await updateDoc(doc(db,'orders',id),{paymentStatus:'Paid'});alert('Payment status updated to Paid ✅');loadOrders()}catch(e){alert('Status update failed: '+e.message)}};
</script></body></html>
