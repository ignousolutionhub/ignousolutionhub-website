<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f6f9;
color:#222;
}

/* HEADER */

header{
background:#0b5ed7;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:25px;
}

.back-btn{
background:white;
color:#0b5ed7;
text-decoration:none;
padding:10px 17px;
border-radius:6px;
font-weight:bold;
}

/* MAIN */

.container{
max-width:1200px;
margin:35px auto;
padding:0 20px;
}

.top-area{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
gap:15px;
}

.top-area h2{
margin:0;
}

.add-btn{
background:#198754;
color:white;
text-decoration:none;
padding:12px 18px;
border-radius:6px;
font-weight:bold;
}

/* PRODUCT GRID */

.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.product-card{
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.badge{
display:inline-block;
background:#e7f0ff;
color:#0b5ed7;
padding:6px 10px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:12px;
}

.product-card h3{
margin:5px 0 12px;
color:#0b5ed7;
font-size:22px;
}

.details{
color:#555;
line-height:1.7;
font-size:15px;
}

.price{
font-size:24px;
font-weight:bold;
color:#198754;
margin:15px 0;
}

.buttons{
display:flex;
gap:10px;
}

button{
border:none;
padding:11px;
border-radius:6px;
cursor:pointer;
font-size:15px;
font-weight:bold;
flex:1;
}

.edit-btn{
background:#ffc107;
color:#222;
}

.delete-btn{
background:#dc3545;
color:white;
}

/* EMPTY / LOADING */

.message{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.10);
font-size:18px;
color:#666;
grid-column:1/-1;
}

/* MOBILE */

@media(max-width:950px){

.product-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

header{
padding:15px;
}

header h1{
font-size:19px;
}

.top-area{
flex-direction:column;
align-items:stretch;
}

.add-btn{
text-align:center;
}

.product-grid{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<h1>Manage Products</h1>

<a href="dashboard.html" class="back-btn">

← Dashboard

</a>

</header>


<div class="container">


<div class="top-area">

<h2>

All Uploaded Products

</h2>


<a href="add-product.html" class="add-btn">

➕ Add New Product

</a>

</div>


<div class="product-grid" id="productGrid">

<div class="message">

Loading products...

</div>

</div>


</div>


<script type="module">


import {

auth,

db

} from "./firebase-config.js";


import {

onAuthStateChanged

} from

"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


import {

collection,

getDocs,

deleteDoc,

doc

} from

"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


const productGrid =

document.getElementById(

"productGrid"

);


/* ADMIN LOGIN CHECK */

onAuthStateChanged(

auth,

function(user){

if(!user){

alert(

"Admin Login Required"

);

window.location.href=

"login.html";

return;

}


loadProducts();

}

);


/* LOAD PRODUCTS */

async function loadProducts(){


productGrid.innerHTML=

`

<div class="message">

Loading products...

</div>

`;


try{


const snapshot =

await getDocs(

collection(

db,

"products"

)

);


if(

snapshot.empty

){


productGrid.innerHTML=

`

<div class="message">

No products found.<br><br>

<a href="add-product.html">

Add your first product

</a>

</div>

`;


return;

}


productGrid.innerHTML="";


snapshot.forEach(

function(productDoc){


const product =

productDoc.data();


const productId =

productDoc.id;


const card =

document.createElement(

"div"

);


card.className=

"product-card";


card.innerHTML=

`

<div class="badge">

${product.type || "Product"}

</div>


<h3>

${product.title || "No Title"}

</h3>


<div class="details">

<b>Course:</b>

${product.course || "Not added"}

<br>


<b>Subject:</b>

${product.subject || "Not added"}

<br>


<b>Description:</b>

${product.description || "No description"}

</div>


<div class="price">

₹${Number(product.price || 0)}

</div>


<div class="buttons">


<button

class="edit-btn"

onclick="editProduct('${productId}')"

>

✏️ Edit

</button>


<button

class="delete-btn"

onclick="deleteProduct('${productId}')"

>

🗑️ Delete

</button>


</div>

`;


productGrid.appendChild(

card

);


}

);


}

catch(error){


console.error(

error

);


productGrid.innerHTML=

`

<div class="message">

Products load nahi hue.

<br><br>

${error.message}

</div>

`;


}

}


/* EDIT PRODUCT */

window.editProduct =

function(productId){


window.location.href=

"edit-product.html?id="

+

encodeURIComponent(

productId

);


};


/* DELETE PRODUCT */

window.deleteProduct =

async function(productId){


const confirmDelete =

confirm(

"Are you sure you want to delete this product?"

);


if(

!confirmDelete

){

return;

}


try{


await deleteDoc(

doc(

db,

"products",

productId

)

);


alert(

"Product deleted successfully"

);


loadProducts();


}

catch(error){


alert(

error.message

);


console.error(

error

);


}

};


</script>


</body>

</html>
