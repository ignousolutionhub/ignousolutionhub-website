<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f6f9;
}

.header{
background:#0b5ed7;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
margin:0;
}

.back{
background:white;
color:#0b5ed7;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:800px;
margin:35px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 3px 15px rgba(0,0,0,.12);
}

h1{
margin-top:0;
color:#0b5ed7;
text-align:center;
}

label{
display:block;
font-weight:bold;
margin-top:16px;
margin-bottom:7px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

textarea{
height:110px;
resize:vertical;
}

.help{
font-size:13px;
color:#666;
margin-top:5px;
}

button{
width:100%;
margin-top:25px;
padding:15px;
background:#198754;
color:white;
border:none;
border-radius:7px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#157347;
}

button:disabled{
background:#888;
cursor:not-allowed;
}

</style>
</head>

<body>

<div class="header">

<h2>IGNOU Solution Hub - Add Product</h2>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</div>


<div class="container">

<h1>Add New Product</h1>

<form id="productForm">

<label>Product Type</label>

<select id="productType" required>

<option value="">Select Product Type</option>

<option>Assignment</option>

<option>Project</option>

<option>Practical</option>

<option>Internship</option>

<option>Guide</option>

<option>Study Material</option>

</select>


<label>Programme</label>

<input
type="text"
id="programme"
placeholder="Example: DECE"
required
>


<label>Course Code</label>

<input
type="text"
id="course"
placeholder="Example: DECE-04"
required
>


<label>Product Title</label>

<input
type="text"
id="title"
placeholder="Example: DECE-04 Internship Report"
required
>


<label>Price (₹)</label>

<input
type="number"
id="price"
placeholder="Example: 2100"
min="1"
required
>


<label>Description</label>

<textarea
id="description"
placeholder="Write complete product details..."
required
></textarea>


<label>Cover Image URL</label>

<input
type="url"
id="imageUrl"
placeholder="Paste image link here"
>


<div class="help">

Image optional hai. Baad me GitHub image link add kar sakte ho.

</div>


<label>Product PDF URL</label>

<input
type="url"
id="pdfUrl"
placeholder="Paste PDF link here"
>


<div class="help">

PDF optional hai. GitHub par PDF upload karke uska link yahan paste karna hoga.

</div>


<button type="submit" id="publishBtn">

Publish Product

</button>

</form>

</div>


<script type="module">

import { db } from "./firebase-config.js";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


const form =

document.getElementById("productForm");


const publishBtn =

document.getElementById("publishBtn");


form.addEventListener(

"submit",

async function(e){

e.preventDefault();


publishBtn.disabled=true;

publishBtn.innerText=

"Saving Product...";


try{


const product={


productType:

document.getElementById(

"productType"

).value,


programme:

document.getElementById(

"programme"

).value.trim(),


course:

document.getElementById(

"course"

).value.trim(),


title:

document.getElementById(

"title"

).value.trim(),


price:

Number(

document.getElementById(

"price"

).value

),


description:

document.getElementById(

"description"

).value.trim(),


imageUrl:

document.getElementById(

"imageUrl"

).value.trim(),


pdfUrl:

document.getElementById(

"pdfUrl"

).value.trim(),


createdAt:

serverTimestamp()


};


await addDoc(

collection(

db,

"products"

),

product

);


alert(

"Product Published Successfully ✅"

);


window.location.href=

"manage-products.html";


}

catch(error){


console.error(error);


alert(

"Product save nahi hua: "

+

error.message

);


publishBtn.disabled=false;


publishBtn.innerText=

"Publish Product";


}


}

);

</script>

</body>
</html>
