<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product - IGNOU Solution Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:30px;
}

.container{
max-width:850px;
margin:auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h2{
color:#0d47a1;
}

.back{
background:#0d47a1;
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:6px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:25px;
background:#0d47a1;
color:white;
border:none;
border-radius:6px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#1565c0;
}

.note{
margin-top:8px;
font-size:13px;
color:#666;
}

@media(max-width:600px){

body{
padding:15px;
}

.container{
padding:20px;
}

.top{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<h2>Add New Product</h2>

<a href="dashboard.html" class="back">

← Dashboard

</a>

</div>

<form id="productForm">

<label>Product Type</label>

<select id="productType" required>

<option value="Assignment">Assignment</option>

<option value="Project">Project</option>

<option value="Practical">Practical</option>

<option value="Internship">Internship</option>

<option value="Study Material">Study Material</option>

<option value="Guide">Guide</option>

</select>


<label>Course / Programme</label>

<input
type="text"
id="course"
placeholder="Example: BCA, MBA, DECE"
required>


<label>Subject / Course Code</label>

<input
type="text"
id="subject"
placeholder="Example: BCS-011">


<label>Product Title</label>

<input
type="text"
id="title"
placeholder="Enter Product Title"
required>


<label>Price (₹)</label>

<input
type="number"
id="price"
placeholder="499"
min="0"
required>


<label>Description</label>

<textarea
id="description"
placeholder="Write Product Description"></textarea>


<label>Cover Image</label>

<input
type="file"
id="image"
accept="image/*"
required>

<p class="note">

JPG, JPEG, PNG ya WEBP image select karein.

</p>


<label>Product PDF File</label>

<input
type="file"
id="pdf"
accept="application/pdf"
required>

<p class="note">

Sirf PDF file select karein.

</p>


<button
type="submit"
id="publishBtn">

Publish Product

</button>

</form>

</div>


<script type="module">

import {

auth,

db,

storage

} from "./firebase-config.js";


import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";


import {

collection,

addDoc,

serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


import {

ref,

uploadBytes,

getDownloadURL

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js";


const form =

document.getElementById("productForm");


const publishBtn =

document.getElementById("publishBtn");


onAuthStateChanged(

auth,

function(user){

if(!user){

alert("Admin Login Required");

window.location.href="login.html";

}

}

);


form.addEventListener(

"submit",

async function(event){

event.preventDefault();


const imageFile =

document.getElementById("image").files[0];


const pdfFile =

document.getElementById("pdf").files[0];


if(!imageFile){

alert("Please select a cover image");

return;

}


if(!pdfFile){

alert("Please select a PDF file");

return;

}


publishBtn.disabled=true;

publishBtn.innerText=

"Uploading Image and PDF...";


try{


const uniqueId =

Date.now()


+

"-"


+

Math.random()

.toString(36)

.substring(2,8);


/* IMAGE UPLOAD */

const imageRef =

ref(

storage,

"product-images/"

+

uniqueId

+

"-"

+

imageFile.name

);


await uploadBytes(

imageRef,

imageFile

);


const imageURL =

await getDownloadURL(

imageRef

);


/* PDF UPLOAD */

const pdfRef =

ref(

storage,

"product-pdfs/"

+

uniqueId

+

"-"

+

pdfFile.name

);


await uploadBytes(

pdfRef,

pdfFile

);


const pdfURL =

await getDownloadURL(

pdfRef

);


/* FIRESTORE PRODUCT SAVE */

publishBtn.innerText=

"Saving Product...";


await addDoc(

collection(

db,

"products"

),

{

type:

document.getElementById(

"productType"

).value,


course:

document.getElementById(

"course"

).value.trim(),


subject:

document.getElementById(

"subject"

).value.trim(),


title:

document.getElementById(

"title"

).value.trim(),


price:

Number(

document.getElementById(

"price"

).value

),


description:

document.getElementById(

"description"

).value.trim(),


imageURL:

imageURL,


pdfURL:

pdfURL,


imageName:

imageFile.name,


pdfName:

pdfFile.name,


createdAt:

serverTimestamp()

}

);


alert(

"Product Published Successfully ✅"

);


form.reset();


window.location.href=

"manage-products.html";


}

catch(error){


console.error(error);


alert(

"Product publish nahi hua: "

+

error.message

);


publishBtn.disabled=false;


publishBtn.innerText=

"Publish Product";


}


}

);

</script>

</body>

</html>
