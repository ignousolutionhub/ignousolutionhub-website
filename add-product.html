<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DECE Assignments - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
}

header{
background:#0b5ed7;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:26px;
}

.cart-btn{
background:white;
color:#0b5ed7;
padding:10px 18px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
font-size:17px;
}

#cartCount{
background:#dc3545;
color:white;
padding:3px 8px;
border-radius:50%;
margin-left:5px;
font-size:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h2{
margin-top:0;
}

.price{
font-size:22px;
font-weight:bold;
color:#0b5ed7;
}

.select-box{
display:block;
margin-top:20px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.select-box input{
width:20px;
height:20px;
vertical-align:middle;
margin-right:8px;
}

.add-button{
display:block;
width:90%;
max-width:600px;
margin:10px auto 35px;
padding:15px;
background:#198754;
color:white;
border:none;
border-radius:7px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.add-button:hover{
background:#157347;
}

</style>

</head>

<body>

<header>

<h1>IGNOU DECE Solved Assignments</h1>

<a href="cart.html" class="cart-btn">

🛒 Cart (<span id="cartCount">0</span>)

</a>

</header>


<div class="grid">


<div class="card">

<h2>DECE-01 Solved Assignment</h2>

<p>Latest Session • Ready to Dispatch</p>

<p class="price">₹250</p>

<label class="select-box">

<input
type="checkbox"
class="product"
data-name="DECE-01 Solved Assignment"
data-price="250">

Select DECE-01

</label>

</div>


<div class="card">

<h2>DECE-02 Solved Assignment</h2>

<p>Latest Session • Ready to Dispatch</p>

<p class="price">₹250</p>

<label class="select-box">

<input
type="checkbox"
class="product"
data-name="DECE-02 Solved Assignment"
data-price="250">

Select DECE-02

</label>

</div>


<div class="card">

<h2>DECE-03 Solved Assignment</h2>

<p>Latest Session • Ready to Dispatch</p>

<p class="price">₹250</p>

<label class="select-box">

<input
type="checkbox"
class="product"
data-name="DECE-03 Solved Assignment"
data-price="250">

Select DECE-03

</label>

</div>


</div>


<button class="add-button" onclick="addSelectedProducts()">

🛒 Add Selected Products To Cart

</button>


<script>

function updateCartCount(){

let cart=JSON.parse(localStorage.getItem("cart")) || [];

document.getElementById("cartCount").innerText=cart.length;

}


function addSelectedProducts(){

let selectedProducts=
document.querySelectorAll(".product:checked");


if(selectedProducts.length===0){

alert("Please select at least one product.");

return;

}


let cart=
JSON.parse(localStorage.getItem("cart")) || [];


let addedCount=0;


selectedProducts.forEach(function(product){

let name=product.dataset.name;

let price=Number(product.dataset.price);


let alreadyAdded=cart.some(function(item){

return item.name===name;

});


if(!alreadyAdded){

cart.push({

name:name,

price:price

});

addedCount++;

}

});


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


updateCartCount();


if(addedCount===0){

alert("Selected products pehle se Cart me hain.");

}else{

alert(

addedCount+

" product(s) successfully Cart me add ho gaye ✅"

);

}


window.location.href="cart.html";

}


updateCartCount();

</script>

</body>

</html>
