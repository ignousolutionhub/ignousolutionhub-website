<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IGNOU Products - IGNOU Solution Hub</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
color:#222;
}

header{
background:#0b5ed7;
color:#fff;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
font-size:26px;
}

.cart-btn{
background:white;
color:#0b5ed7;
padding:10px 18px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
font-size:17px;
}

#cartCount{
background:red;
color:white;
padding:3px 8px;
border-radius:50%;
margin-left:5px;
font-size:14px;
}

.info{
padding:18px 25px 0;
font-size:17px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:20px;
padding:25px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
border-radius:8px;
margin-bottom:15px;
}

.type{
display:inline-block;
background:#e7f0ff;
color:#0b5ed7;
padding:6px 10px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:12px;
}

.card h2{
margin:5px 0 10px;
font-size:22px;
}

.details{
color:#555;
line-height:1.5;
}

.price{
font-size:23px;
font-weight:bold;
color:#0b5ed7;
margin:15px 0;
}

.select-box{
display:block;
margin-top:15px;
font-size:16px;
font-weight:bold;
}

.select-box input{
width:20px;
height:20px;
vertical-align:middle;
margin-right:8px;
}

.empty{
grid-column:1/-1;
background:white;
padding:40px;
text-align:center;
border-radius:12px;
font-size:19px;
}

.add-button{
display:block;
width:90%;
max-width:650px;
margin:5px auto 35px;
padding:15px;
background:#198754;
color:white;
border:none;
border-radius:7px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.add-button:hover{
background:#146c43;
}

</style>

</head>

<body>

<header>

<h1>IGNOU Products</h1>

<a href="cart.html" class="cart-btn">

🛒 Cart

<span id="cartCount">0</span>

</a>

</header>


<div class="info">

Select one or more products and add them to your cart.

</div>


<div class="grid" id="productGrid">

<div class="empty">

Loading products...

</div>

</div>


<button
class="add-button"
onclick="addSelectedProducts()">

Add Selected Products To Cart

</button>


<script type="module">

import { db } from "./firebase-config.js";

import {

collection,
getDocs,
query,
orderBy

}

from

"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


let loadedProducts=[];


/* CART COUNT */

function updateCartCount(){

let cart=

JSON.parse(

localStorage.getItem("cart")

)

|| [];


document.getElementById(

"cartCount"

).innerText=

cart.length;

}


updateCartCount();


/* LOAD PRODUCTS */

async function loadProducts(){

const productGrid=

document.getElementById(

"productGrid"

);


try{


const productQuery=

query(

collection(

db,

"products"

),

orderBy(

"createdAt",

"desc"

)

);


const snapshot=

await getDocs(

productQuery

);


loadedProducts=[];


snapshot.forEach(

function(doc){

loadedProducts.push({

id:doc.id,

...doc.data()

});

}

);


if(

loadedProducts.length===0

){

productGrid.innerHTML=

`

<div class="empty">

No products available yet.

</div>

`;

return;

}


let html="";


loadedProducts.forEach(

function(product,index){

let image="";


if(

product.imageUrl

){

image=

`

<img
src="${product.imageUrl}"
alt="${product.title}"
>

`;

}


html +=

`

<div class="card">

${image}

<div class="type">

${product.productType || "Product"}

</div>

<h2>

${product.title || "IGNOU Product"}

</h2>

<div class="details">

<b>Programme:</b>

${product.programme || "-"}

<br>

<b>Course:</b>

${product.course || "-"}

<br><br>

${product.description || ""}

</div>

<div class="price">

₹${Number(product.price || 0)}

</div>

<label class="select-box">

<input
type="checkbox"
class="product"
data-index="${index}"
>

Select this product

</label>

</div>

`;

}

);


productGrid.innerHTML=

html;


}

catch(error){

console.error(error);


productGrid.innerHTML=

`

<div class="empty">

Products load nahi hue.

<br><br>

${error.message}

</div>

`;

}


}


loadProducts();


/* ADD SELECTED PRODUCTS */

window.addSelectedProducts=

function(){

const selected=

document.querySelectorAll(

".product:checked"

);


if(

selected.length===0

){

alert(

"Please select at least one product."

);

return;

}


let cart=

JSON.parse(

localStorage.getItem("cart")

)

|| [];


selected.forEach(

function(box){

const product=

loadedProducts[

box.dataset.index

];


cart.push({

name:

product.title,

price:

Number(

product.price

),

programme:

product.programme || "",

course:

product.course || "",

productType:

product.productType || ""

});

}

);


localStorage.setItem(

"cart",

JSON.stringify(cart)

);


updateCartCount();


alert(

selected.length +

" product(s) Cart me add ho gaye."

);


window.location.href=

"cart.html";


};


</script>

</body>

</html>
