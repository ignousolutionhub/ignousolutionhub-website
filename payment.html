<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - IGNOU Solution Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.container{

max-width:600px;
margin:50px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);

}

h1{

text-align:center;
color:#0d6efd;
margin-bottom:20px;

}

.total{

font-size:30px;
font-weight:bold;
text-align:center;
color:#198754;
margin:25px 0;

}

.upi{

text-align:center;
font-size:22px;
margin-bottom:25px;

}

button{

width:100%;
padding:15px;
font-size:18px;
background:#198754;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#157347;

}

.note{

margin-top:20px;
text-align:center;
color:#666;

}

</style>

</head>

<body>

<div class="container">

<h1>Complete Payment</h1>

<div class="total">

₹ <span id="amount">0</span>

</div>

<div class="upi">

<b>UPI ID</b><br>

jineshsingh01@oksbi

</div>

<button id="payBtn">

I Have Paid

</button>

<div class="note">

Payment complete karne ke baad hi button dabaye.

</div>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {

collection,
addDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

cart.forEach(item=>{

total += item.price;

});

document.getElementById("amount").innerHTML = total;

document.getElementById("payBtn").addEventListener("click",paymentDone);

async function paymentDone(){

let order = JSON.parse(localStorage.getItem("latestOrder"));

  let total = 0;

cart.forEach(item=>{
    total += Number(item.price);
});

await addDoc(collection(db,"orders"),{

    customerName: order.name,

    mobile: order.mobile,

    email: order.email,

    enrollment: order.enrollment,

    programme: order.programme,

    course: order.course,

    address: order.address,

    pincode: order.pincode,

    cart: cart,

    totalAmount: total,

    paymentStatus: "Pending",

    dispatchStatus: "Pending",

    createdAt: serverTimestamp()

});

localStorage.removeItem("cart");

alert("Order Successfully Placed");

window.location.href="success.html";

}

</script>

</body>

</html>
