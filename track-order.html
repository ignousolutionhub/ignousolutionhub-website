<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order - IGNOU Assignment Hub</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f4f6f9;color:#222}
.site-header{position:sticky;top:0;z-index:1000;background:#0b5ed7;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;box-shadow:0 2px 8px #0003}.logo{font-size:22px;font-weight:bold}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-weight:bold}.cart-link{background:#fff;color:#0b5ed7;padding:8px 13px;border-radius:20px;text-decoration:none;font-weight:bold}
.container{max-width:800px;margin:35px auto;padding:0 18px}.box,.result{background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);margin-bottom:20px}h1{text-align:center;color:#0b5ed7;margin-top:0}.sub{text-align:center;color:#666}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.tab{padding:11px;border:2px solid #0b5ed7;background:#fff;color:#0b5ed7;border-radius:7px;font-weight:bold;cursor:pointer}.tab.active{background:#0b5ed7;color:#fff}.search-row{display:flex;gap:10px}.search-row input{flex:1;padding:13px;border:1px solid #bbb;border-radius:7px;font-size:16px}.search-row button{padding:13px 20px;background:#198754;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.message{text-align:center;padding:20px;color:#666}.order-head{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #ddd;padding-bottom:12px}.order-head h2{margin:0;color:#0b5ed7}.status{padding:9px 13px;border-radius:7px;background:#fff3cd;color:#856404;font-weight:bold;height:max-content}.status.delivered{background:#d1e7dd;color:#0f5132}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.detail{background:#f7f9fc;padding:12px;border-radius:7px}.detail b{display:block;color:#666;font-size:13px;margin-bottom:5px}.products{border-top:1px solid #ddd;padding-top:15px}.product{padding:12px;background:#f7f9fc;border-radius:7px;margin:8px 0}.tracking{margin-top:18px;background:#eef5ff;padding:15px;border-radius:8px}.tracking h3{margin-top:0;color:#0b5ed7}.track-number{font-size:20px;font-weight:bold}.back{display:inline-block;margin-top:15px;background:#6c757d;color:#fff;text-decoration:none;padding:11px 18px;border-radius:7px}@media(max-width:600px){.tabs{grid-template-columns:1fr}.search-row{flex-direction:column}.search-row button{width:100%}.details{grid-template-columns:1fr}.order-head{flex-direction:column}}
</style>
</head>
<body>
<header class="site-header"><div class="logo">IGNOU Assignment Hub</div><nav class="nav"><a href="index.html">Home</a><a href="assignments.html">Assignments</a><a href="project-services.html">Project / Internship</a><a href="study-material.html">Study Material</a><a href="guide.html">Guide</a><a href="contact.html">Contact</a><a href="track-order.html">Track Order</a></nav><a class="cart-link" href="cart-fixed.html">🛒 Cart <span id="cartCount">0</span></a></header>
<div class="container">
<div class="box"><h1>Track Your Order</h1><p class="sub">Mobile number, email or IGNOU enrollment number se apna order check karein.</p>
<div class="tabs"><button class="tab active" data-type="mobile">Mobile</button><button class="tab" data-type="email">Email</button><button class="tab" data-type="enrollment">Enrollment No.</button></div>
<div class="search-row"><input id="identifier" placeholder="Enter your mobile number"><button id="trackBtn">Track Order</button></div><div id="message" class="message"></div></div>
<div id="results"></div></div>
<script type="module">
import{db}from'./firebase-config.js';
import{collection,getDocs,query,where,orderBy}from'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
let searchType='mobile';
const input=document.getElementById('identifier');
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');searchType=btn.dataset.type;input.placeholder=searchType==='mobile'?'Enter your mobile number':searchType==='email'?'Enter your email address':'Enter IGNOU enrollment number';input.value=''}));
document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('cart')||'[]').length;
document.getElementById('trackBtn').addEventListener('click',track);
input.addEventListener('keydown',e=>{if(e.key==='Enter')track()});
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function track(){const value=input.value.trim();const msg=document.getElementById('message');const results=document.getElementById('results');results.innerHTML='';if(!value){msg.innerText='Please enter your details.';return}msg.innerText='Searching order...';try{const q=query(collection(db,'orders'),where(searchType,'==',value));const snap=await getDocs(q);if(snap.empty){msg.innerText='No order found. Details dobara check karein.';return}msg.innerText='';const docs=[];snap.forEach(d=>docs.push({id:d.id,data:d.data()}));docs.sort((a,b)=>{const at=a.data.createdAt?.toMillis?.()||0,bt=b.data.createdAt?.toMillis?.()||0;return bt-at});docs.forEach(({id:oId,data:o})=>renderOrder(oId,o));}catch(e){console.error(e);msg.innerText='Order track nahi ho pa raha. Please try again.'}}
function renderOrder(id,o){let products='';(o.cart||[]).forEach((x,i)=>{products+=`<div class="product"><b>${i+1}. ${esc(x.name||'Product')}</b> — ₹${Number(x.price||0)}${x.course?`<br><small>Course Code: ${esc(x.course)}</small>`:''}</div>`});const ts=o.trackingStatus||o.dispatchStatus||'Processing';const delivered=String(ts).toLowerCase()==='delivered';const box=document.createElement('div');box.className='result';box.innerHTML=`<div class="order-head"><div><h2>Order #${esc(id)}</h2><div>Placed by: ${esc(o.customerName||'Customer')}</div></div><div class="status ${delivered?'delivered':''}">${esc(ts)}</div></div><div class="details"><div class="detail"><b>Mobile</b>${esc(o.mobile||'')}</div><div class="detail"><b>Email</b>${esc(o.email||'')}</div><div class="detail"><b>Enrollment</b>${esc(o.enrollment||'')}</div><div class="detail"><b>Total Amount</b>₹${Number(o.totalAmount||0)}</div></div><div class="products"><h3>Products</h3>${products||'<p>No product details available.</p>'}</div><div class="tracking"><h3>📦 Delivery / Tracking</h3><p><b>Status:</b> ${esc(ts)}</p>${o.trackingNumber?`<p><b>Speed Post / Tracking Number:</b> <span class="track-number">${esc(o.trackingNumber)}</span></p>`:'<p>Tracking number abhi add nahi hua hai.</p>'}${o.trackingNote?`<p><b>Update:</b> ${esc(o.trackingNote)}</p>`:''}${o.trackingUpdatedAt?.toDate?`<p><small>Last updated: ${esc(o.trackingUpdatedAt.toDate().toLocaleString('en-IN'))}</small></p>`:''}</div>`;document.getElementById('results').appendChild(box)}
</script>
</body></html>
